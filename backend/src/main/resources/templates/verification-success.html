<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>E-Mail bestätigt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #e7eaf0;
            font-family: "Segoe UI", Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: #151924;
        }
        .card {
            position: relative;
            background: #ffffff;
            border: 1px solid #c9d0db;
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 28px 60px -24px rgba(20, 26, 40, 0.32);
        }
        .card::before {
            content: "";
            display: block;
            height: 4px;
            background: linear-gradient(90deg, #d9152b, #ff6a3d);
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 28px 32px 0;
        }
        .header img { border-radius: 10px; }
        .header span { font-size: 15px; font-weight: 700; }
        .body { padding: 28px 32px 36px; text-align: center; }
        h1 { font-size: 24px; letter-spacing: -0.03em; margin-bottom: 12px; }
        p { color: #545c70; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
        .btn {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #d9152b, #e24a3a);
            color: #ffffff;
            padding: 13px 24px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
        }
        .footer { border-top: 1px solid #dde2ea; padding: 16px 32px 22px; text-align: center; }
        .footer p { color: #868da0; font-size: 12px; margin: 0; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <img src="/icon.png" width="36" height="36" alt=""/>
        <span>Lecture Survival Kit</span>
    </div>
    <div class="body">
        <h1>E-Mail bestätigt</h1>
        <p>Deine E-Mail-Adresse ist bestätigt. Du kannst dich jetzt anmelden.</p>
        <a th:href="${loginUrl}" class="btn">Zur Anmeldung</a>
    </div>
    <div class="footer">
        <p>Lecture Survival Kit</p>
    </div>
</div>
</body>
</html>
