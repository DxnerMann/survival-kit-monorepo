server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # All routes fall back to index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}